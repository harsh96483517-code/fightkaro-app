name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android project (landscape, fullscreen, icons)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 scripts/patch-android.py

      - name: Fetch 3D models and audio from the live site
        run: python3 scripts/fetch-assets.py

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk fightkaro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fightkaro-apk
          path: fightkaro.apk
          if-no-files-found: error

      - name: Publish APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: FightKaro APK (latest build)
          body: |
            Debug-signed APK built automatically by GitHub Actions from the current `main` branch.
            Install it on Android 6.0+ (enable "install unknown apps" for your browser/file manager).
          files: fightkaro.apk
          make_latest: true
